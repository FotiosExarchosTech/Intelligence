<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant face</title>
  <link rel="stylesheet" href="face.css">
</head>
<body>
  <canvas id="face" aria-hidden="true"></canvas>
  <p id="caption" aria-live="polite"></p>
  <div id="language" role="group" aria-label="Γλώσσα / Language">
    <button type="button" data-language="el" aria-pressed="false" lang="el">ΕΛ</button>
    <button type="button" data-language="en" aria-pressed="false" lang="en">EN</button>
  </div>
  <button id="stop" type="button" aria-label="Stop" title="Stop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" /></svg>
  </button>
  <script type="module" src="face.js"></script>
</body>
</html>
