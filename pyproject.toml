[project]
name = "intelligence"
version = "0.1.0"
description = "Interactive AI assistant with an animated face, voice, vision and narrated web-app demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.159.1",
    "faster-whisper>=1.1",
    "groq>=1.7.0",
    "mediapipe>=1.1.1",
    "numpy>=1.26",
    "ollama>=0.6.3",
    "onnx-asr[hub]>=0.12.0",
    "onnxruntime>=1.18",
    "opencv-contrib-python>=5.0.0.93",
    "piper-tts>=1.3",
    "playwright>=1.64.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
assistant = "assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]
